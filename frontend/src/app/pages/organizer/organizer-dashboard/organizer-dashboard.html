<div class="min-h-screen bg-gray-100 flex">
  <aside
    [class.w-64]="sidebarOpen"
    [class.w-20]="!sidebarOpen"
    class="bg-gray-900 text-white transition-all duration-300 fixed h-full z-20">

    <!-- Logo & Toggle -->
    <div class="flex items-center justify-between p-4 border-b border-gray-800">
      @if (sidebarOpen){
        <div class="flex items-center space-x-3">
          <div class="bg-indigo-600 p-2 rounded-lg">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M2 9a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3"></path>
              <path d="M2 9v9a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V9"></path>
              <path d="M10 12h4"></path>
              <path d="M10 16h4"></path>
            </svg>
          </div>
          <span class="font-bold text-lg">EventTicket</span>
        </div>
      }
      <button
        (click)="toggleSidebar()"
        class="p-2 rounded-lg hover:bg-gray-800 transition">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M3 12h18M3 6h18M3 18h18"/>
        </svg>
      </button>
    </div>

    <!-- Navigation Items -->
    <nav class="p-4 space-y-2">
      <a
        routerLink="/organizer/dashboard"
        routerLinkActive="bg-indigo-600"
        class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 transition cursor-pointer group">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="3" width="7" height="7"></rect>
          <rect x="14" y="3" width="7" height="7"></rect>
          <rect x="14" y="14" width="7" height="7"></rect>
          <rect x="3" y="14" width="7" height="7"></rect>
        </svg>
        @if (sidebarOpen) {
          <span  class="font-medium">Tableau de bord</span>
        }
      </a>

      <a
        routerLink="/organizer/events"
        routerLinkActive="bg-indigo-600"
        class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 transition cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
        </svg>
        @if (sidebarOpen) {
          <span  class="font-medium">Mes evenements</span>
        }
      </a>



      <a
        routerLink="/organizer/analytics"
        routerLinkActive="bg-indigo-600"
        class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 transition cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-width="2">
          <line x1="18" y1="20" x2="18" y2="10"></line>
          <line x1="12" y1="20" x2="12" y2="4"></line>
          <line x1="6" y1="20" x2="6" y2="14"></line>
        </svg>
        @if (sidebarOpen) {
          <span class="font-medium">Statistiques</span>
        }
      </a>

      <a
        routerLink="/organizer/settings"
        routerLinkActive="bg-indigo-600"
        class="flex items-center space-x-3 p-3 rounded-lg hover:bg-gray-800 transition cursor-pointer">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="3"></circle>
          <path d="M12 1v6m0 6v6m5.66-16.66l-4.25 4.25m0 8.49l4.25 4.25M23 12h-6m-6 0H1m16.66 5.66l-4.25-4.25m0-8.49l4.25-4.25"></path>
        </svg>
        @if (sidebarOpen) {
          <span  class="font-medium">Parametres</span>
        }
      </a>
    </nav>
    <!-- Logout Button -->
    <div class="absolute bottom-0 left-0 right-0 p-4 border-t border-gray-800">
      <button
        (click)="logout()"
        class="flex items-center space-x-3 p-3 rounded-lg hover:bg-red-600 transition w-full text-left">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
          <polyline points="16 17 21 12 16 7"></polyline>
          <line x1="21" y1="12" x2="9" y2="12"></line>
        </svg>
        @if (sidebarOpen) {
          <span  class="font-medium">Deconnexion</span>
        }
      </button>
    </div>
  </aside>
  <main
    [class.ml-64]="sidebarOpen"
    [class.ml-20]="!sidebarOpen"
    class="flex-1 transition-all duration-300"
  >
    <!-- Top Header Bar -->
    <header class="bg-white shadow-sm sticky top-0 z-10">
      <div class="flex items-center justify-between px-6 py-4">
        <h1 class="text-2xl font-bold text-gray-900">Espace Organisateur</h1>

        <button class="bg-green-600 hover:bg-green-700 text-white rounded font-inter text-center px-6 py-2 flex items-center gap-2 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/>
          </svg>
          Créer un événement
        </button>


        <div class="flex items-center space-x-4">
          <!-- Notifications -->
          <button class="relative p-2 rounded-lg hover:bg-gray-100 transition">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-gray-600" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
              <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
            </svg>
            <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
          </button>

          <!-- User Profile -->
          <div class="flex items-center space-x-3">
            <div class="w-10 h-10 bg-indigo-600 rounded-full flex items-center justify-center text-white font-bold">
              O
            </div>
            <div class="hidden md:block">
              <p class="text-sm font-semibold text-gray-900">Organisateur</p>
              <p class="text-xs text-gray-500">Admin</p>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Content Area -->
    <div class="p-6">
      <router-outlet />
    </div>
  </main>
</div>
