<div class="flex items-center justify-center min-h-screen p-4 bg-gradient-to-br from-orange-50 via-white to-orange-50">
  <div class="w-full  max-w-md mx-auto  p-8 bg-white shadow-xl rounded-2xl border-2 border-gray-300">

    <svg class="mx-auto h-12 w-auto text-orange-950 dark:text-indigo-400" xmlns="http://www.w3.org/2000/svg" fill="none"
         viewBox="0 0 24 24" stroke-width="1.5" stroke="currentColor">
      <path stroke-linecap="round" stroke-linejoin="round"
            d="M15.75 6a3.75 3.75 0 11-7.5 0 3.75 3.75 0 017.5 0zM4.501 20.118a7.5 7.5 0 0114.998 0A17.933 17.933 0 0112 21.75c-2.676 0-5.216-.584-7.499-1.632z"/>
    </svg>
    <h2 class="text-2xl font-bold mb-5 text-center">
      Connexion Organisateur
    </h2>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()">
      <div class="mb-4">
        <label class="block mb-1 font-medium">Email</label>
        <input
          type="email"
          formControlName="email"
          class="w-full border px-3 py-2 rounded"
          placeholder="ex: contact@event.com"
        >
        @if (hasError('email')) {
          <p class="text-red-600 text-sm mt-1">Email invalide</p>
        }
      </div>
      <div class="mb-4">
        <label class="block mb-1 font-medium">Mot de passe</label>
        <input
          type="password"
          formControlName="password"
          class="w-full border px-3 py-2 rounded"
          placeholder="••••••••"
        >
        @if (hasError('password')) {
          <p class="text-red-600 text-sm mt-1">Mot de passe invalide (min. 6 caractères)</p>
        }
      </div>
      @if (errorMessage) {
        <p class="text-red-600 mb-4 text-center">{{ errorMessage }}</p>
      }
      <button
        type="submit"
        class="w-full py-2 rounded bg-orange-950 text-white font-semibold  transition"
        [disabled]="isLoading"
      >
        @if (!isLoading) {
          Se connecter
        } @else {
          Connexion...
        }
      </button>
      <p class="mt-4 text-center">
        Pas encore inscrit ?
        <a routerLink="/organizer/register" class="orange-800 hover:underline">
          Créer un compte
        </a>
      </p>
    </form>
  </div>
</div>
