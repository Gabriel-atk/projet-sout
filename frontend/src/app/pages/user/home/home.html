<div class="min-h-screen relative">
  <div class="absolute inset-0 bg-cover bg-center bg-no-repeat"
       style="background-image: url('https://images.unsplash.com/photo-1517457373958-b7bdd4587205?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=1169')"
  >
    <div class="absolute inset-0 opacity-50"></div>
  </div>

  <div class="relative z-10 max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-20">
    <div class="grid lg:grid-cols-2 gap-12 items-center">
      <!-- Left Content -->
      <div class="text-white">
        <h1 class="text-5xl lg:text-6xl font-bold mb-6 leading-tight">
          Découvrez et Réservez les Meilleurs Événements à Lomé
        </h1>
        <p class="text-xl text-indigo-100 mb-8 leading-relaxed">
          Plateforme moderne de billetterie en ligne avec tickets numériques sécurisés et QR codes. Simplifiez vos
          réservations d'événements.
        </p>
        <div class="flex flex-wrap gap-4">
          <button
            [routerLink]="['organizer/auth']"
            class="bg-white text-indigo-600 px-8 py-4 rounded-lg font-semibold font-inter text-lg hover:bg-indigo-50 transition shadow-lg">
            Explorer les Événements
          </button>
          <button
            class="bg-white/20 backdrop-blur-sm text-white border-2 border-white px-8 py-4 rounded-lg font-semibold text-lg transition">
            Organiser un Événement
          </button>
        </div>
      </div>
    </div>
  </div>
</div>
