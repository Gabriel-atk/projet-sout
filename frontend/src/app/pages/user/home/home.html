<div class="relative min-h-screen overflow-hidden flex items-center justify-center">
  <div class="absolute inset-0">
    <div class="absolute inset-0 bg-cover bg-center bg-no-repeat"
         style="background-image: url('https://images.unsplash.com/photo-1517457373958-b7bdd4587205?ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D&auto=format&fit=crop&q=80&w=1169')">
    </div>
    <div class="absolute inset-0 bg-gradient-to-br from-indigo-900/95 via-purple-900/90 to-pink-900/85"></div>
  </div>

  <div class="absolute inset-0 overflow-hidden pointer-events-none">
    <div class="absolute top-20 left-10 w-72 h-72 bg-purple-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob">czdvz</div>
    <div class="absolute top-40 right-10 w-72 h-72 bg-yellow-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-2000"></div>
    <div class="absolute -bottom-8 left-20 w-72 h-72 bg-pink-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 animate-blob animation-delay-4000"></div>
  </div>

  <div class="relative z-10 max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 text-center">
    <h1 class="text-5xl lg:text-6xl font-bold text-white leading-tight mb-6">
      Réservez les Meilleurs Événements à Lomé
    </h1>

    <p class="text-xl text-indigo-100 mb-8 leading-relaxed">
      Plateforme moderne de billetterie en ligne avec tickets numériques sécurisés et QR codes.
      Simplifiez vos réservations d'événements.
    </p>

    <div class="flex flex-col sm:flex-row gap-4 justify-center">
      <button
        [routerLink]="['/events']"
        class="bg-white text-indigo-600 px-8 py-4 rounded-lg font-semibold font-inter text-lg hover:bg-indigo-50 transition shadow-lg">
        Explorer les Événements
      </button>

      <button
        [routerLink]="['/organizer/login']"
        class="bg-white/20 backdrop-blur-sm text-white border-2 border-white px-8 py-4 rounded-lg font-semibold text-lg hover:bg-white/30 transition">
        Organiser un Événement
      </button>
      <button [routerLink]="['/organizer/dashboard']">Test Dashboard</button>
    </div>
  </div>

  <!-- Flèche scroll down -->
  <div class="absolute bottom-10 left-1/2 transform -translate-x-1/2 animate-bounce">
    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
      <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 14l-7 7m0 0l-7-7m7 7V3"></path>
    </svg>
  </div>
</div>

<!-- Animations CSS -->
<style>
  @keyframes blob {
    0%, 100% {
      transform: translate(0, 0) scale(1);
    }
    25% {
      transform: translate(20px, -50px) scale(1.1);
    }
    50% {
      transform: translate(-20px, 20px) scale(0.9);
    }
    75% {
      transform: translate(50px, 30px) scale(1.05);
    }
  }

  .animate-blob {
    animation: blob 10s ease-in-out infinite;
  }

  .animation-delay-2000 {
    animation-delay: 2s;
  }

  .animation-delay-4000 {
    animation-delay: 4s;
  }
</style>
