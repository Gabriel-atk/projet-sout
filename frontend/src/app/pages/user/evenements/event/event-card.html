<div (click)="showDetails()"
     class="group relative flex flex-col bg-white rounded-2xl shadow-md hover:shadow-xl hover:-translate-y-1 transition-all duration-300 overflow-hidden cursor-pointer border border-gray-100 h-full">
  <div class="relative overflow-hidden">
    <img [src]="event.images?.[0] || 'assets/default-event.jpg'"
         alt="{{event.name}}"
         class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110"/>
    <div class="absolute inset-0 bg-gradient-to-t from-black/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>

    @if (isExpired()){
      <div
        class="expired-ribbon"
      >
        Expiré
      </div>
    }
  </div>

  <div class="flex flex-col flex-grow p-6 ">
    <div class="flex items-center gap-2 mb-3 font-inter text-sm text-orange-600 bg-orange-50 w-fit px-3 py-1 rounded-lg">
        <svg class="w-4 h-4 mt-0.5 flex-shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M8 7V3m8 4V3m-9 8h10M5 21h14a2 2 0 002-2V7a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
        <span>
          Du {{formatDate(event.startDateTime)}}
          @if (event.endDateTime){
            <span> au {{formatDate(event.endDateTime)}}</span>
          }
        </span>
    </div>



    <h3 class="text-lg font-bold text-gray-900 leading-tight mb-2 line-clamp-2 group-hover:text-orange-600 transition-colors">
      {{event.name}}
    </h3>
    <!-- Espace vide pour pousser le bouton vers le bas si le texte est court -->
    <div class="flex-grow"></div>

  </div>
  <div class="p-5 pt-0 mt-auto">
    <button (click)="$event.stopPropagation(); onReserve()"
            [disabled]="isExpired()"
            class="w-full flex items-center justify-center gap-2 bg-gray-900 hover:bg-orange-600 text-white font-semibold py-3.5 px-6 rounded transition-all duration-300 shadow-lg shadow-gray-200 disabled:bg-gray-300 disabled:cursor-not-allowed disabled:shadow-none group/btn">
      <span>Réserver</span>
      <!-- Petite flèche qui bouge au survol du bouton -->
      <svg class="w-4 h-4 transition-transform duration-300 group-hover/btn:translate-x-1" fill="none" stroke="currentColor" viewBox="0 0 24 24">
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 8l4 4m0 0l-4 4m4-4H3"/>
      </svg>
    </button>
  </div>
</div>
