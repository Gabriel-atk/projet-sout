<!-- inscription.component.html avec FormGroup -->
<div class="min-h-screen bg-gray-50 py-12 px-4">
  <div class="max-w-2xl mx-auto">
    <div class="text-center mb-8">
      <h1 class="text-3xl font-inter font-bold text-gray-900 mb-3">
        Espace Client | Inscription
      </h1>
      <p class="font-montserrat text-gray-600">
        Vous avez déjà un compte ?
        <a routerLink="/login" class="text-gray-600 font-inter hover:text-gray-900 font-medium underline">Connectez-vous</a>
      </p>
    </div>

    <div class="bg-gray-200 rounded shadow-sm p-8 font-inter">
      @if (errorMessage){
        <div class="mb-4 p-3 bg-red-50 border border-red-200 text-red-700 rounded-lg text-sm">
          {{errorMessage}}
        </div>
      }

      @if (successMessage){
        <div class="mb-4 p-3 bg-green-50 border border-green-200 text-green-700 rounded-lg text-sm">
          {{successMessage}}
        </div>
      }

      <form [formGroup]="inscriptionForm" (ngSubmit)="onSubmit()">

        <div class="mb-6">
          <label class="block text-gray-900 font-semibold mb-2">
            Nom <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            formControlName="nom"
            class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <div class="mb-6">
          <label class="block text-gray-900 font-semibold mb-2">
            Prénom(s) <span class="text-red-500">*</span>
          </label>
          <input
            type="text"
            formControlName="prenom"
            class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent"
          />
        </div>

        <div class="mb-6">
          <label class="block text-gray-900 font-semibold mb-2">
            Numéro de téléphone <span class="text-red-500">*</span>
          </label>
          <div class="flex gap-3">
            <input
              type="text"
              formControlName="indicatif"
              class="w-32 px-4 py-3 border border-gray-300 rounded bg-gray-50"
            />
            <input
              type="tel"
              formControlName="telephone"
              class="flex-1 px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="********"
            />
          </div>
        </div>

        <div class="mb-6">
          <label class="block text-gray-900 font-semibold mb-2">
            Email <span class="text-red-500">*</span>
          </label>
          <input
            type="email"
            formControlName="email"
            class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div class="mb-6">
          <label class="block text-gray-900 font-semibold mb-2">
            Mot de passe <span class="text-red-500">*</span>
          </label>
          <input
            type="password"
            formControlName="motDePasse"
            class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div class="mb-8">
          <label class="block text-gray-900 font-semibold mb-2">
            Confirmer le mot de passe <span class="text-red-500">*</span>
          </label>
          <input
            type="password"
            formControlName="confirmPassword"
            class="w-full px-4 py-3 border border-gray-300 rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          />
        </div>

        <div class="flex justify-center">
          <button
            type="submit"
            [disabled]="!inscriptionForm.valid"
            class="bg-yellow-400 hover:bg-yellow-500 text-gray-900 font-semibold px-12 py-3 rounded transition shadow-sm disabled:opacity-50 disabled:cursor-not-allowed"
          >
            @if (isLoading){
              <span>Inscription...</span>
            } @else {
              <span>S'inscrire</span>
            }
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
