<!-- header.component.html -->
<nav class="bg-white shadow-sm">
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <div class="flex items-center justify-between h-16">
      <!-- Logo -->
      <div class="flex items-center space-x-2">
        <div class="bg-indigo-600 p-2 rounded-lg">
          <svg xmlns="http://www.w3.org/2000/svg" class="w-6 h-6 text-white" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M2 9a3 3 0 0 1 3-3h14a3 3 0 0 1 3 3"></path>
            <path d="M2 9v9a3 3 0 0 0 3 3h14a3 3 0 0 0 3-3V9"></path>
            <path d="M10 12h4"></path>
            <path d="M10 16h4"></path>
          </svg>
        </div>
        <span class="text-xl font-bold text-gray-900">EventTicket</span>
      </div>

      <!-- Menu Navigation -->
      <div class="hidden md:flex items-center space-x-5 text-xl">
        <a routerLink="/"
           routerLinkActive="!text-black border-b-2 border-black"
           [routerLinkActiveOptions]="{exact: true}"
           class="text-gray-500 font-inter hover:text-black font-bold transition">Accueil</a>
        <a routerLink="/events"
           routerLinkActive="!text-black border-b-2 border-black"
           [routerLinkActiveOptions]="{exact: false}"
           class="text-gray-500 font-inter font-bold hover:text-black transition">Événements</a>
        <a routerLink="/reservations"
           routerLinkActive="!text-black border-b-2 border-black"
           [routerLinkActiveOptions]="{exact: false}"
           class="text-gray-500 font-inter font-bold hover:text-black transition">Mes tickets</a>
        <a routerLink="/contact"
           routerLinkActive="!text-black border-b-2 border-black"
           [routerLinkActiveOptions]="{exact: false}"
           class="text-gray-500 font-inter font-bold hover:text-black transition">Contact</a>
      </div>

      <!-- Search & Auth Buttons -->
      <div class="flex items-center space-x-4">
        <!-- Search Bar -->


        @if (!isLoggedIn()) {
          <ng-container>
            <button routerLink="/login" class="bg-black text-white font-inter text-center px-6 py-2 rounded font-medium ">
              Connexion
            </button>
            <button routerLink="/inscription" class="border-2 border-gray-300 font-inter text-gray-900 px-6 py-2 rounded font-medium ">
              Inscription
            </button>

          </ng-container>
        }

        @if (isLoggedIn()) {
          <ng-container>
            <div class="relative">
              <button
              (click)="toggleProfileMenu()"
              class="flex items-center space-x-2 focus:outline-none">
                <div class="w-10 h-10 rounded-full overflow-hidden border-2 border-gray-300 hover:border-black transition cursor-pointer">
                  <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
                    <path d="M12 2C9.51472 2 7.5 4.01472 7.5 6.5C7.5 8.98528 9.51472 11 12 11C14.4853 11 16.5 8.98528 16.5 6.5C16.5 4.01472 14.4853 2 12 2Z" fill="black"/><path d="M12 12.5C8.73708 12.5 6.14047 14.213 4.77277 16.7569C4.19622 17.8293 4.41122 18.9365 5.05292 19.7348C5.67643 20.5105 6.69558 21 7.79526 21H16.2047C17.3044 21 18.3236 20.5105 18.9471 19.7348C19.5888 18.9365 19.8038 17.8293 19.2272 16.7569C17.8595 14.213 15.2629 12.5 12 12.5Z" fill="black"/>
                  </svg>
                </div>
              </button>
              @if (isProfileMenuOpen) {
                <div class="absolute right-0 mt-2 w-48 bg-white rounded-lg shadow-lg py-2 z-50 border border-gray-200">
                  <div class="px-4 py-2 border-b border-gray-200">
                    <p class="text-sm font-semibold text-gray-900">{{ user()?.firstName }} {{ user()?.lastName }}</p>
                    <p class="text-xs text-gray-500">{{ user()?.email }}</p>
                  </div>
                  <a routerLink="/profile" (click)="closeProfileMenu()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                    Mon profil
                  </a>
                  <a routerLink="/reservations" (click)="closeProfileMenu()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                    Mes tickets
                  </a>
                  <a routerLink="/parametres" (click)="closeProfileMenu()" class="block px-4 py-2 text-sm text-gray-700 hover:bg-gray-100">
                    Paramètres
                  </a>
                  <div class="border-t border-gray-200 mt-2">
                    <button
                      (click)="logout()"
                      class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-gray-100"
                    >
                      Déconnexion
                    </button>
                  </div>
                </div>
              }
            </div>
          </ng-container>
        }


      </div>
    </div>
  </div>
</nav>

@if (isProfileMenuOpen){
  <div (click)="closeProfileMenu()"
  class="fixed inset-0 z-40"></div>
}
